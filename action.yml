name: ryl
description: Lint and format YAML with ryl, a fast YAML linter and formatter
author: owenlamont

branding:
  icon: check-circle
  color: blue

inputs:
  version:
    description: >-
      ryl release to install, as X.Y.Z. Defaults to the release this action tag
      pins.
    required: false
    default: 0.26.1
  args:
    description: >-
      Arguments passed to ryl, split like a shell command line so quoted values
      stay whole, e.g. check -d 'lint.rules = { truthy = "disable" }' .
    required: false
    default: check .
  install-only:
    description: >-
      Install ryl and put it on PATH for later steps without running it; args is
      then ignored.
    required: false
    default: 'false'

outputs:
  ryl-version:
    description: Version of the installed ryl
    value: ${{ steps.ryl.outputs.ryl-version }}
  ryl-path:
    description: Absolute path to the installed ryl executable
    value: ${{ steps.ryl.outputs.ryl-path }}

runs:
  using: composite
  steps:
    - name: Install and run ryl
      id: ryl
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/ryl-action.sh"'
      env:
        GHA_RYL_VERSION: ${{ inputs.version }}
        GHA_RYL_ARGS: ${{ inputs.args }}
        GHA_RYL_INSTALL_ONLY: ${{ inputs.install-only }}
