name: ryl-action
description: Lint and format YAML with ryl, a fast YAML linter and formatter
author: owenlamont

branding:
  icon: check-circle
  color: blue

inputs:
  version:
    description: >-
      ryl release to install, as X.Y.Z. Defaults to the release this action tag
      pins.
    required: false
    default: 0.27.0
  args:
    description: >-
      Arguments passed to ryl, split on whitespace (newlines included) with no
      quoting;
      pass config through config or config-data instead.
    required: false
    default: check .
  config:
    description: Path to a ryl config file, passed as -c.
    required: false
    default: ''
  config-data:
    description: Inline ryl config (TOML, or yamllint YAML), passed whole as -d.
    required: false
    default: ''
  install-only:
    description: >-
      Install ryl and put it on PATH for later steps without running it; args is
      then ignored.
    required: false
    default: 'false'

outputs:
  ryl-version:
    description: Version of the installed ryl
    value: ${{ steps.ryl.outputs.ryl-version }}
  ryl-path:
    description: Absolute path to the installed ryl executable
    value: ${{ steps.ryl.outputs.ryl-path }}

runs:
  using: composite
  steps:
    - name: Install and run ryl
      id: ryl
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/ryl-action.sh"'
      env:
        GHA_RYL_VERSION: ${{ inputs.version }}
        GHA_RYL_ARGS: ${{ inputs.args }}
        GHA_RYL_CONFIG: ${{ inputs.config }}
        GHA_RYL_CONFIG_DATA: ${{ inputs.config-data }}
        GHA_RYL_INSTALL_ONLY: ${{ inputs.install-only }}
